site:
  title: Advanced Operating Systems
  short_title: AOS
  locale: en
  timezone: Europe/Rome
  summary: >-
    Advanced Operating Systems combines operating-system theory with practical
    work on concurrency, Linux kernels, virtualization, embedded systems, and
    system-level programming.

